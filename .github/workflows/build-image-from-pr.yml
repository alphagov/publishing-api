name: Build image from PR

on:
  workflow_dispatch:
    inputs:
      gitRef:
        description: 'Commit, tag or branch name to build from'
        required: true
        type: string
  pull_request:

jobs:
  build-image-from-PR:
    name: Build image from PR
    uses: alphagov/govuk-infrastructure/.github/workflows/build-image-from-pr.yml@main
    with:
      gitRef: ${{ inputs.gitRef || github.head_ref }}
    permissions:
      id-token: write
      contents: read

  # Lets govuk-preview-app preview any branch of Publishing API, building
  # and pushing to ghcr.io/alphagov/govuk/publishing-api with the branch
  # name as the image tag, unless the branch name contains a '/' (which
  # cannot be used as a Docker tag), in which case no image is pushed.
  push-image:
    name: Build and publish image
    # Don't build and push the image for forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: alphagov/govuk-infrastructure/.github/workflows/build-push-arm-image.yml@main
    with:
      gitRef: ${{ github.event.pull_request.head.sha }}
      additionalTags: type=raw,value=${{ github.event.pull_request.head.ref }},enable=${{ !contains(github.event.pull_request.head.ref, '/') }}
    permissions:
      id-token: write
      contents: read
      packages: write
