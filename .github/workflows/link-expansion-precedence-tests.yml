name: Link expansion precedence tests
on:
  pull_request:
    paths:
      - app/presenters/queries/expanded_link_set.rb
      - app/queries/edition_links.rb
      - app/queries/get_edition_ids_with_fallbacks.rb
      - app/queries/links.rb
      - lib/expansion_rules/**
      - lib/link_expansion.rb
      - lib/link_expansion/**
      - spec/integration/link_expansion/*precedence*_spec.rb
      - spec/support/link_expansion_precedence_helpers/**
jobs:
  test-direct-link-precedence-same-content-id:
    name: "Test direct link expansion precedence with same content ID"
    runs-on: ubuntu-latest
    steps:
      - name: Setup Postgres
        id: setup-postgres-direct-link-precedence-same-content-id
        uses: alphagov/govuk-infrastructure/.github/actions/setup-postgres@main
        with:
          POSTGRES_DB: postgres-link-precedence

      - name: Setup Redis
        uses: alphagov/govuk-infrastructure/.github/actions/setup-redis@main

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Initialize database
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: ${{ steps.setup-postgres-direct-link-precedence-same-content-id.outputs.db-url }}
        run: bundle exec rails db:setup

      - name: Prepare for parallel testing
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: ${{ steps.setup-postgres-direct-link-precedence-same-content-id.outputs.db-url }}
        run: bundle exec rake db:parallel:create db:parallel:prepare

      - name: Run RSpec in parallel
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: ${{ steps.setup-postgres-direct-link-precedence-same-content-id.outputs.db-url }}
        run: bundle exec prspec spec/integration/link_expansion/direct_link_precedence_with_same_content_ids_spec.rb

  test-direct-link-precedence-different-content-id:
    name: "Test direct link expansion precedence with different content IDs"
    runs-on: ubuntu-latest
    steps:
      - name: Setup Postgres
        id: setup-postgres-direct-link-precedence-different-content-id
        uses: alphagov/govuk-infrastructure/.github/actions/setup-postgres@main
        with:
          POSTGRES_DB: postgres-link-precedence

      - name: Setup Redis
        uses: alphagov/govuk-infrastructure/.github/actions/setup-redis@main

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Initialize database
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: ${{ steps.setup-postgres-direct-link-precedence-different-content-id.outputs.db-url }}
        run: bundle exec rails db:setup

      - name: Prepare for parallel testing
